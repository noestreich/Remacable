# Konfiguration fuer send2rm. Alles ist optional — was fehlt, kommt aus den
# Defaults in send2rm.py.

# Zielordner in der reMarkable-Cloud, wenn eine Quelle nichts eigenes sagt.
target_folder = "/Inbox"

# Hochgeladene Dateien nach "Uploaded/" verschieben (false = sofort loeschen).
keep_uploaded = true

# Dateien in "Uploaded/" nach so vielen Tagen wegraeumen (0 = nie aufraeumen).
cleanup_uploaded_days = 30

# macOS-Benachrichtigung nach Upload bzw. bei Fehlern.
notify = true

# Sekunden, die vor dem Upload gewartet wird, um zu pruefen, ob die Datei noch
# waechst (laufende Kopie, Download, Komprimierung).
stable_wait = 2.0

# Obergrenze pro Datei in MB.
max_mb = 200

# Pfade — nur anpassen, wenn etwas woanders liegt.
# rmapi = "./bin/rmapi"
# rmapi_config = "~/.rmapi"
# soffice = "/Applications/LibreOffice.app/Contents/MacOS/soffice"
# ebook_convert = "/Applications/calibre.app/Contents/MacOS/ebook-convert"
# log_file = "~/Library/Logs/send2rm.log"
# state_file = "~/Library/Application Support/send2rm/seen.json"


# ─── Watch-Folder ─────────────────────────────────────────────────────────────
# Alles, was hier landet, geht hoch und wandert danach nach Uploaded/.
#
# subfolders = true spiegelt Unterordner in die Cloud:
#   ~/reMarkable Inbox/Zeitungen/xyz.pdf   ->   /Inbox/Zeitungen
# Damit kann der Downloader seine Kopie einfach in einen Unterordner legen.

[[sources]]
path = "~/reMarkable Inbox"
target_folder = "/Inbox"
move = true
subfolders = true

# Optional: Dateinamen vor dem Upload zu Titeln umschreiben. match ist ein
# regulaerer Ausdruck auf den Namen ohne Endung, title darf \1, \2 ... nutzen.
# Beispiel — aus "BMP_2026_22082026" wird "Berliner Morgenpost 2026-08-22":
#
# [[sources.rename]]
# match = '^BMP_\d{4}_(\d{2})(\d{2})(\d{4})$'
# title = 'Berliner Morgenpost \3-\2-\1'


# ─── Weitere Quellen ──────────────────────────────────────────────────────────
# Ein fremder Ordner, der nicht angetastet werden soll (nichts wird verschoben
# oder geloescht; ein State-File merkt sich, was schon hochgeladen wurde):
#
# [[sources]]
# path = "~/Downloads"
# patterns = ["Zeitung_*.pdf"]
# target_folder = "/Zeitungen"
# move = false
# max_age_days = 2       # aelteres Archiv ignorieren
# stable_wait = 15       # warten, bis nachtraegliche Komprimierung durch ist
